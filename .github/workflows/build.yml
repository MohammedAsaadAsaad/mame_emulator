name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - name: Fetch Linux natives (cores + helpers)
        run: |
          chmod +x scripts/fetch_cores.sh scripts/build_helpers.sh
          ./scripts/fetch_cores.sh
          ./scripts/build_helpers.sh
      - run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          cp -a build/linux/x64/release/bundle dist/mame_cabinet-linux-x64
          # Sanity: cores + helpers must be inside the bundle
          if ! find dist/mame_cabinet-linux-x64/cores -name '*.so' 2>/dev/null | grep -q .; then
            echo 'bundle missing cores/*.so'
            find dist/mame_cabinet-linux-x64 -type f
            exit 1
          fi
          if [ ! -f dist/mame_cabinet-linux-x64/libhost_helpers.so ] \
             && [ ! -f dist/mame_cabinet-linux-x64/lib/libhost_helpers.so ]; then
            echo 'bundle missing libhost_helpers.so'
            exit 1
          fi
          echo 'Package contains cores + libhost_helpers.so'
          (cd dist && tar -czf mame_cabinet-linux-x64.tar.gz mame_cabinet-linux-x64)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/mame_cabinet-linux-x64.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch Windows natives (cores + helpers)
        shell: pwsh
        run: .\scripts\fetch_windows_cores.ps1
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/mame_cabinet-windows-x64.zip
          # Sanity: cores + helpers must be inside the zip
          $zip = Get-ChildItem dist\mame_cabinet-windows-x64.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries | ForEach-Object { $_.FullName }
          if (-not ($entries | Where-Object { $_ -match 'cores/.*\.dll$' })) { throw 'ZIP missing cores/*.dll' }
          if (-not ($entries | Where-Object { $_ -match 'host_helpers\.dll$' })) { throw 'ZIP missing host_helpers.dll' }
          Write-Host 'Package contains cores + host_helpers.dll'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/mame_cabinet-windows-x64.zip

  android:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            flutter_platform: android-arm
            artifact: android-arm
            apk_name: mame_cabinet-armeabi-v7a.apk
          - abi: arm64-v8a
            flutter_platform: android-arm64
            artifact: android-arm64
            apk_name: mame_cabinet-arm64-v8a.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Neo Geo BIOS into assets (required for Metal Slug on Android)
        env:
          NEOGEO_BIOS_PASSPHRASE: ${{ secrets.NEOGEO_BIOS_PASSPHRASE }}
        run: |
          chmod +x scripts/decrypt_bios.sh
          ./scripts/decrypt_bios.sh
          # Confirm Flutter will package it
          test -f assets/bios/neogeo.zip
          ls -lh assets/bios/neogeo.zip
      - name: Bundle FBNeo cheat pack into assets
        run: |
          chmod +x scripts/sync_cheats.sh
          curl -fsSL -o /tmp/fbneo-cheats.zip \
            https://github.com/finalburnneo/FBNeo-cheats/archive/refs/heads/master.zip
          unzip -q /tmp/fbneo-cheats.zip -d /tmp
          ./scripts/sync_cheats.sh /tmp/FBNeo-cheats-master/cheats
          test -f assets/cheats/fbneo_cheats.zip
          ls -lh assets/cheats/fbneo_cheats.zip
      - run: flutter pub get
      - name: Fetch Android natives (cores + helpers)
        env:
          ANDROID_NDK_VERSION: "26.3.11579264"
        run: |
          chmod +x scripts/fetch_android_cores.sh
          ./scripts/fetch_android_cores.sh
      - name: Build ${{ matrix.abi }} APK
        run: flutter build apk --release --target-platform ${{ matrix.flutter_platform }}
      - name: Verify APK contains neogeo.zip
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Flutter assets live under assets/flutter_assets/ in the APK
          if ! unzip -l "$APK" | grep -E 'flutter_assets/assets/bios/neogeo\.zip$'; then
            echo 'APK is missing bundled Neo Geo BIOS'
            unzip -l "$APK" | grep -i bios || true
            exit 1
          fi
          echo 'APK includes assets/bios/neogeo.zip'
      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ matrix.apk_name }}"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.apk_name }}
