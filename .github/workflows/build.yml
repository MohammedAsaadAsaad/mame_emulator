name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          cp -a build/linux/x64/release/bundle dist/mame_cabinet-linux-x64
          (cd dist && tar -czf mame_cabinet-linux-x64.tar.gz mame_cabinet-linux-x64)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/mame_cabinet-linux-x64.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/mame_cabinet-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/mame_cabinet-windows-x64.zip

  android:
    name: Android APK (armeabi-v7a + arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/mame_cabinet-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/mame_cabinet-arm64-v8a.apk
          # Also keep universal if present
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/mame_cabinet-universal.apk
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            dist/mame_cabinet-armeabi-v7a.apk
            dist/mame_cabinet-arm64-v8a.apk
